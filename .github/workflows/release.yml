name: Build and publish MASTER RGB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            [xml]$project = Get-Content MASTER_RGB.csproj
            $baseVersion = [version]$project.Project.PropertyGroup.Version

            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -Headers $headers
            $publishedVersions = @(
              $releases |
                ForEach-Object {
                  if ($_.tag_name -match '^v?(\d+\.\d+\.\d+)$') {
                    try { [version]$Matches[1] } catch { $null }
                  }
                } |
                Where-Object { $null -ne $_ }
            )

            $latestVersion = $baseVersion
            if ($publishedVersions.Count -gt 0) {
              $latestPublished = $publishedVersions | Sort-Object -Descending | Select-Object -First 1
              if ($latestPublished -gt $latestVersion) {
                $latestVersion = $latestPublished
              }
            }

            $version = "$($latestVersion.Major).$($latestVersion.Minor).$($latestVersion.Build + 1)"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "### MASTER HUB release version: $version" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Selected release version: $version"

      - name: Restore
        run: dotnet restore MASTER_RGB.csproj

      - name: Publish Windows x64
        run: dotnet publish MASTER_RGB.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.VERSION }} -p:DebugType=None -p:DebugSymbols=false -o publish/app

      - name: Publish independent maintenance utility
        run: |
          dotnet publish Maintenance/MasterHubMaintenance.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/maintenance
          Copy-Item "publish/maintenance/MASTER HUB - Manutencao.exe" "publish/app/MASTER HUB - Manutencao.exe" -Force

      - name: Bundle OpenRGB 1.1 SDK server runtime (background, no GUI)
        shell: pwsh
        run: |
          $archive = "OpenRGB_1.1_Windows_64_8e16de2.zip"
          $url = "https://github.com/CalcProgrammer1/OpenRGB/releases/download/release_1.1/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "63291726c6fc84eb479ef2ee752e97e1187f6ce9c49fd27eee40ded588a8172a") { throw "OpenRGB archive SHA256 mismatch: $hash" }
          Expand-Archive -Path $archive -DestinationPath openrgb-extracted -Force
          $exe = Get-ChildItem openrgb-extracted -Filter OpenRGB.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "OpenRGB.exe not found in official portable archive" }
          New-Item -ItemType Directory -Force -Path publish/app/OpenRGB | Out-Null
          Copy-Item -Path (Join-Path $exe.Directory.FullName "*") -Destination publish/app/OpenRGB -Recurse -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/CalcProgrammer1/OpenRGB/release_1.1/LICENSE" -OutFile publish/app/OpenRGB/COPYING.txt
          @(
            "OpenRGB 1.1 is bundled as a separate runtime and launched with --server in the background by MASTER RGB; the OpenRGB graphical interface is not required.",
            "Project: https://gitlab.com/CalcProgrammer1/OpenRGB",
            "Source code (release_1.1): https://github.com/CalcProgrammer1/OpenRGB/tree/release_1.1",
            "License: GNU General Public License version 2 or (at your option) any later version.",
            "The complete license text is in OpenRGB/COPYING.txt. OpenRGB is a separate program; MASTER RGB communicates with it through its documented SDK protocol."
          ) | Set-Content publish/app/THIRD-PARTY-NOTICES.txt -Encoding utf8

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release feed
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --outputDir publish/releases
        continue-on-error: true

      - name: Pack installer and update packages
        run: vpk pack --packId masterhub04.master-rgb --packVersion ${{ env.VERSION }} --packDir publish/app --mainExe "MASTER HUB.exe" --packTitle "MASTER HUB" --outputDir publish/releases --msi --instLocation Either

      - name: Publish GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir publish/releases --publish --releaseName "MASTER HUB ${{ env.VERSION }}" --tag v${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
